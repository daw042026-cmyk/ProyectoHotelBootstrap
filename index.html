<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Musik Boutique Hotel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .logo { width: 110px; height: 56px; border: 1px solid #222; font-family: Georgia, serif; font-size: .75rem; line-height: 1.05; }
    .flag { width: 34px; height: 24px; display: block; }
    .menu-link { color: #b5714a; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; }
    .hero { min-height: 100svh; background: linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.55)), #555 center / cover; }
  </style>
</head>
<body class="bg-light">

  <header class="border-bottom px-3 py-2">
    <div class="d-flex align-items-center justify-content-between">
      <div class="logo d-flex align-items-center justify-content-center text-center bg-white"><img src="imgs/logo.png" alt=""></div>
      <div class="d-flex align-items-center gap-2">
        <svg class="flag" viewBox="0 0 3 2" aria-label="Español"><rect width="3" height="2" fill="#c60b1e"/><rect y=".5" width="3" height="1" fill="#ffc400"/></svg>
        <svg class="flag" viewBox="0 0 5 3" aria-label="Deutsch"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#dd0000"/><rect y="2" width="5" height="1" fill="#ffce00"/></svg>
        <svg class="flag" viewBox="0 0 60 30" aria-label="English"><clipPath id="c"><rect width="60" height="30"/></clipPath><g clip-path="url(#c)"><rect width="60" height="30" fill="#012169"/><path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0L60 30M60 0L0 30" stroke="#C8102E" stroke-width="2"/><path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6"/></g></svg>
        <button class="navbar-toggler border-0" data-bs-toggle="offcanvas" data-bs-target="#menu" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </div>
    <small class="text-secondary text-uppercase" style="font-size:.65rem">Adults only · Born, BCN</small>
  </header>

  <div class="offcanvas offcanvas-end w-100" tabindex="-1" id="menu">
    <div class="offcanvas-header border-bottom">
      <div class="logo d-flex align-items-center justify-content-center text-center bg-white">Musik<br>Boutique<br>Hotel</div>
      <button class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body">
      <h2 class="display-6 mb-3" style="font-family: Georgia, serif;">Menú</h2>
      <div class="list-group list-group-flush">
        <a class="list-group-item list-group-item-action menu-link py-4 border-dark" href="#contacto">Contacto</a>
        <a class="list-group-item list-group-item-action menu-link py-4 border-dark" href="#servicios">Servicios</a>
        <a class="list-group-item list-group-item-action menu-link py-4 border-dark" href="#resenas">Reseñas</a>
        <a class="list-group-item list-group-item-action menu-link py-4 border-dark" href="#habitaciones">Habitaciones</a>
      </div>
    </div>
  </div>

  <section class="hero text-white d-flex flex-column justify-content-between p-3">
    <p class="fw-semibold text-uppercase small mb-0">Hotel Boutique - El Born - Barcelona</p>
    <h1 class="display-5 mb-4" style="font-family: Georgia, serif;">Historia<br>que se vive<br>a diario.</h1>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
